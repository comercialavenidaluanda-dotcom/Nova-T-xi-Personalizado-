name: NOVA Táxi — APK Debug Independente

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure NOVA Táxi Supabase publishable key
        shell: bash
        env:
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_KEY" ]; then echo "Configure a variável de repositório SUPABASE_PUBLISHABLE_KEY com a publishable key do projeto NOVA Táxi."; exit 1; fi
          sed -i "s/%%SUPABASE_PUBLISHABLE_KEY%%/$SUPABASE_KEY/g" android/app/src/main/java/ao/novataxi/app/MainActivity.kt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$(find android -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
