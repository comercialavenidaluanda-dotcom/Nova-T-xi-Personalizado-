name: NOVA Táxi — APK Debug

on:
  push:
    branches:
      - feature/nova-fleet-intelligence
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    branches:
      - feature/nova-ui-orange
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure NOVA Táxi Supabase publishable key
        shell: bash
        env:
          SUPABASE_KEY: sb_publishable_npmGIVLGfRsF8L9UINRnrA_9yqmA7UK
        run: |
          set -euo pipefail
          test -n "$SUPABASE_KEY"
          sed -i "s/%%SUPABASE_PUBLISHABLE_KEY%%/$SUPABASE_KEY/g" android/app/src/main/java/ao/novataxi/app/MainActivity.kt
          if grep -q "%%SUPABASE_PUBLISHABLE_KEY%%" android/app/src/main/java/ao/novataxi/app/MainActivity.kt; then
            echo "Supabase publishable-key placeholder was not replaced"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
