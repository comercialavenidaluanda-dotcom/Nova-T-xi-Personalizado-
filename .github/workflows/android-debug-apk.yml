name: NOVA Taxi Android APK

on:
  push:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "nova-táxi.zip"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android source
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src
          unzip -q "nova-táxi.zip" -d build-src
          test -f build-src/gradlew
          chmod +x build-src/gradlew

      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: https://earucsaqqtbllnqsxvlb.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_npmGIVLGfRsF8L9UINRnrA_9yqmA7UK
        run: |
          set -e
          printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > build-src/.env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: build-src
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          ls -lh build-src/app/build/outputs/apk/debug/*.apk
          sha256sum build-src/app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-debug-apk-test
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
