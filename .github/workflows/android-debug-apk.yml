name: NOVA Taxi Android APK

on:
  push:
    paths:
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source and configure Supabase
        run: |
          curl -L --fail -o nova-taxi-source.zip https://raw.githubusercontent.com/comercialavenidaluanda-dotcom/Nova-T-xi-Personalizado-/main/nova-táxi.zip
          unzip -q nova-taxi-source.zip -d build-src
          printf 'SUPABASE_URL=https://earucsaqqtbllnqsxvlb.supabase.co\nSUPABASE_ANON_KEY=sb_publishable_npmGIVLGfRsF8L9UINRnrA_9yqmA7UK\n' > build-src/.env

      - name: Apply compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("build-src")
          api=root/"app/src/main/java/com/example/core/network/SupabaseApiService.kt"
          auth=root/"app/src/main/java/com/example/data/repository/AuthRepository.kt"
          canvas=root/"app/src/main/java/com/example/ui/components/NovaMapCanvas.kt"
          build=root/"app/build.gradle.kts"

          s=api.read_text()
          s=s.replace('data class SupabaseAuthSession(\n    @Json(name = "access_token") val accessToken: String,',
                      'data class SupabaseAuthSession(\n    @Json(name = "access_token") val accessToken: String? = null,')
          if "suspend fun applyDriver(" not in s:
              marker='    @POST("rest/v1/rpc/nova_calculate_fare_and_commission")\n    suspend fun rpcCalculateFareAndCommission(\n        @Body payload: NovaCalculateFarePayload\n    ): Response<NovaFareCalculationResponse>'
              s=s.replace(marker, marker+'\n\n    @POST("rest/v1/rpc/nova_taxi_apply_driver")\n    suspend fun applyDriver(@Body payload: Map<String, Any>): Response<Unit>')
          api.write_text(s)

          s=auth.read_text()
          s=s.replace('if (session.accessToken.isNotBlank()) {','if (!session.accessToken.isNullOrBlank()) {')
          s=s.replace('SupabaseNetworkClient.setAuthToken(session.accessToken)','SupabaseNetworkClient.setAuthToken(session.accessToken!!)')
          a=s.find('            // Inserir perfil na tabela nova_taxi_profiles')
          b=s.find('            val user = User(',a)
          if a>=0 and b>=0:
              s=s[:a]+'            // Perfil criado pelo trigger seguro do Supabase.\n\n'+s[b:]
          d=s.find('    override suspend fun registerDriver(')
          if d>=0:
              section=s[d:]
              section=section.replace('data = mapOf("full_name" to name.trim(), "role" to "PASSENGER")',
                                      'data = mapOf("full_name" to name.trim(), "role" to "DRIVER")',1)
              a=section.find('            // Inserir perfil com role inicial PASSENGER')
              b=section.find('            _driverApprovalStatus.value = "PENDING"',a)
              if a>=0 and b>=0:
                  block='''            val driverResponse = SupabaseNetworkClient.restApi.applyDriver(
                mapOf(
                    "p_document_number" to documentNumber.trim().uppercase(),
                    "p_license_number" to licenseNumber.trim().uppercase(),
                    "p_vehicle_brand" to vehicleBrand.trim(),
                    "p_vehicle_model" to vehicleModel.trim(),
                    "p_plate_number" to licensePlate.trim().uppercase(),
                    "p_vehicle_color" to vehicleColor.trim(),
                    "p_vehicle_year" to vehicleYear,
                    "p_category" to "COOL"
                )
            )
            if (!driverResponse.isSuccessful) {
                return@withContext Result.failure(Exception("Não foi possível submeter a candidatura de motorista."))
            }

'''
                  section=section[:a]+block+section[b:]
              s=s[:d]+section
          auth.write_text(s)

          c=canvas.read_text()
          if 'import androidx.compose.foundation.layout.Arrangement' not in c:
              c=c.replace('import androidx.compose.foundation.layout.Box',
                          'import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Box',1)
              canvas.write_text(c)

          b=build.read_text()
          b=b.replace('versionCode = 1','versionCode = 2').replace('versionName = "1.0"','versionName = "1.0.1"')
          build.write_text(b)
          PY

          keytool -genkeypair -keystore build-src/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000 >/dev/null 2>&1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: build-src
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-debug-apk-supabase
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
