name: NOVA Taxi Android APK v3

on:
  push:
    paths:
      - '.github/workflows/android-build3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          curl -L --fail -o source.zip https://raw.githubusercontent.com/comercialavenidaluanda-dotcom/Nova-T-xi-Personalizado-/main/nova-táxi.zip
          unzip -q source.zip -d src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build
        working-directory: src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-debug-apk-1.0.1
          path: src/app/build/outputs/apk/debug/*.apk
