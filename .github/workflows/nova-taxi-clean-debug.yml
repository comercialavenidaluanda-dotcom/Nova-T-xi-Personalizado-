name: NOVA Taxi - Clean Debug Build

on:
  push:
    branches: ["rebuild/nova-taxi-clean-debug"]
    paths:
      - "android/**"
      - ".github/workflows/nova-taxi-clean-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-debug:
    name: Clean build, verify and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout clean rebuild branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Clean previous build outputs
        working-directory: android
        run: gradle clean --no-daemon

      - name: Compile debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and application identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size:"
          stat -c '%s bytes' "$APK"
          echo "SHA-256:"
          sha256sum "$APK"
          echo "Application identity:"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | head -n 3

      - name: Upload clean debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-taxi-clean-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
