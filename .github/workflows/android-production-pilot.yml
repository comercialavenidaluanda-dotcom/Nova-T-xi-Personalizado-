name: NOVA Táxi — APK assinado para grupo-piloto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-pilot:
    name: Compilar e verificar APK assinado
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" já não está disponível no repositório Android.
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Preparar assinatura sem expor segredos
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-taxi-production.jks"
          keytool -list -keystore "$RUNNER_TEMP/nova-taxi-production.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore e alias validados."

      - name: Compilar variante release
        working-directory: android
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleRelease --no-daemon

      - name: Alinhar e assinar APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f 4 "$UNSIGNED" "$RUNNER_TEMP/nova-taxi-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nova-taxi-production.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/NOVA-Taxi-Piloto-Production.apk" \
            "$RUNNER_TEMP/nova-taxi-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/NOVA-Taxi-Piloto-Production.apk"

      - name: Publicar artefacto para download (sem publicar na loja)
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Taxi-Piloto-Production
          path: ${{ runner.temp }}/NOVA-Taxi-Piloto-Production.apk
          if-no-files-found: error
          retention-days: 14
